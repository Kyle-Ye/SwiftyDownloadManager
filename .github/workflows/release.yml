name: Publish Xcode Cloud Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag built from its Xcode Cloud release branch
        required: true
        type: string
      rebuild:
        description: Rebuild this exact tag in Xcode Cloud (for expired archives)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish notarized Xcode Cloud artifact
    runs-on: macos-26
    timeout-minutes: 100
    defaults:
      run:
        working-directory: release-source
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      REBUILD_ARCHIVE: ${{ inputs.rebuild || false }}
      APP_BUNDLE_ID: top.kyleye.swifty-download-manager-app
      XCODE_CLOUD_WORKFLOW: Release
    steps:
      - name: Check out the publishing tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          path: release-source

      - name: Test the publishing tools
        run: ruby ../release-tools/Scripts/tests/xcode_cloud_release_test.rb

      - name: Validate the release tag, branch, and source versions
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use MAJOR.MINOR.PATCH format: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "Checked-out commit does not match tag $RELEASE_TAG" >&2
            exit 1
          fi

          release_line="${RELEASE_TAG%.*}"
          release_branch="release/$release_line"
          git fetch --no-tags origin \
            "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
          if ! git merge-base --is-ancestor \
            "$tag_commit" "refs/remotes/origin/$release_branch"; then
            echo "$RELEASE_TAG is not on origin/$release_branch" >&2
            exit 1
          fi

          echo "RELEASE_COMMIT=$tag_commit" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=$release_branch" >> "$GITHUB_ENV"

          test "$(grep -F -c "\"CFBundleShortVersionString\": \"$RELEASE_TAG\"" Project.swift)" -eq 2
          test "$(plutil -extract version raw -o - SafariExtension/Resources/manifest.json)" = "$RELEASE_TAG"
          test "$(plutil -extract version raw -o - ChromeExtension/Resources/manifest.json)" = "$RELEASE_TAG"
          grep -F "return \"$RELEASE_TAG\";" Packages/SDMCore/Sources/SDMEngine/Engine.cpp
          grep -F "SDMCoreInfo.engineVersion, \"$RELEASE_TAG\"" Packages/SDMCore/Tests/SDMCoreTests/SDMCoreInfoTests.swift

      - name: Configure App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${API_KEY_BASE64:?Missing APP_STORE_CONNECT_API_KEY_BASE64 secret}"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          {
            echo "API_KEY_PATH=$api_key_path"
            echo "ARTIFACT_METADATA=$RUNNER_TEMP/xcode-cloud-artifact.json"
            echo "ARTIFACT_DOWNLOAD=$RUNNER_TEMP/xcode-cloud-artifact.zip"
            echo "EXTRACT_DIR=$RUNNER_TEMP/xcode-cloud-extract"
            echo "RELEASE_ZIP=$RUNNER_TEMP/SwiftyDownloadManager.app.zip"
          } >> "$GITHUB_ENV"

      - name: Wait for Xcode Cloud notarization
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${API_KEY_ID:?Missing APP_STORE_CONNECT_API_KEY_ID secret}"
          : "${API_ISSUER_ID:?Missing APP_STORE_CONNECT_API_ISSUER_ID secret}"
          artifact_options=(
            --bundle-id "$APP_BUNDLE_ID"
            --workflow "$XCODE_CLOUD_WORKFLOW"
            --branch "$RELEASE_BRANCH"
            --tag "$RELEASE_TAG"
            --commit "$RELEASE_COMMIT"
            --key-id "$API_KEY_ID"
            --issuer-id "$API_ISSUER_ID"
            --private-key "$API_KEY_PATH"
            --output "$ARTIFACT_METADATA"
          )
          if [[ "$REBUILD_ARCHIVE" == "true" ]]; then
            artifact_options+=(--rebuild)
          fi
          ruby ../release-tools/Scripts/wait-for-xcode-cloud-artifact.rb "${artifact_options[@]}"

      - name: Download the notarized artifact
        run: |
          set -euo pipefail
          artifact_url="$(jq -r '.artifact_url' "$ARTIFACT_METADATA")"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$ARTIFACT_DOWNLOAD" \
            "$artifact_url"
          test "$(stat -f '%z' "$ARTIFACT_DOWNLOAD")" -gt 0

      - name: Verify and package the notarized app
        run: |
          set -euo pipefail
          mkdir "$EXTRACT_DIR"
          ditto -x -k "$ARTIFACT_DOWNLOAD" "$EXTRACT_DIR"

          apps=()
          while IFS= read -r -d '' app; do
            apps+=("$app")
          done < <(find "$EXTRACT_DIR" \
            -type d \
            -name 'Swifty Download Manager.app' \
            -print0)
          if [[ "${#apps[@]}" -ne 1 ]]; then
            echo "Expected one notarized app, found ${#apps[@]}" >&2
            find "$EXTRACT_DIR" -maxdepth 5 -print
            exit 1
          fi
          app_path="${apps[0]}"
          extension_path="$app_path/Contents/PlugIns/Swifty Download Manager Extension.appex"

          codesign --verify --deep --strict --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          app_version="$(plutil -extract CFBundleShortVersionString raw -o - "$app_path/Contents/Info.plist")"
          extension_version="$(plutil -extract CFBundleShortVersionString raw -o - "$extension_path/Contents/Info.plist")"
          manifest_version="$(plutil -extract version raw -o - "$extension_path/Contents/Resources/manifest.json")"
          if [[ "$app_version" != "$RELEASE_TAG" || \
                "$extension_version" != "$RELEASE_TAG" || \
                "$manifest_version" != "$RELEASE_TAG" ]]; then
            echo "Tag and notarized bundle versions do not match" >&2
            exit 1
          fi

          binary_versions="$(
            strings "$app_path/Contents/MacOS/SDMApp" | \
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | \
              sort -u || true
          )"
          grep -Fxq "$RELEASE_TAG" <<< "$binary_versions"

          architectures="$(lipo -archs "$app_path/Contents/MacOS/SDMApp")"
          if [[ "$architectures" != *arm64* || "$architectures" != *x86_64* ]]; then
            echo "Release must contain arm64 and x86_64: $architectures" >&2
            exit 1
          fi

          for legal_file in App/Resources/Legal/*; do
            test -f "$app_path/Contents/Resources/${legal_file##*/}"
          done
          if find "$app_path" -iname '*LookInside*' -print -quit | grep -q .; then
            echo "Release contains a development-only LookInside artifact" >&2
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RELEASE_ZIP"
          unzip -t "$RELEASE_ZIP"
          shasum -a 256 "$RELEASE_ZIP"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous_tag="$(ruby ../release-tools/Scripts/previous-release-tag.rb "$RELEASE_TAG")"
          notes_options=(-f "tag_name=$RELEASE_TAG")
          if [[ -n "$previous_tag" ]]; then
            notes_options+=(-f "previous_tag_name=$previous_tag")
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            "${notes_options[@]}" --jq '.body' > "$notes_file"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" \
              --verify-tag \
              --title "Swifty Download Manager $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi

      - name: Verify the published download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets | \
            jq -e '.assets | length == 1 and .[0].name == "SwiftyDownloadManager.app.zip"'
          download_dir="$RUNNER_TEMP/published-release"
          mkdir "$download_dir"
          gh release download "$RELEASE_TAG" \
            --pattern SwiftyDownloadManager.app.zip --dir "$download_dir"
          cmp "$RELEASE_ZIP" "$download_dir/SwiftyDownloadManager.app.zip"
          shasum -a 256 "$download_dir/SwiftyDownloadManager.app.zip"

      - name: Remove App Store Connect key
        if: always()
        run: |
          if [[ -n "${API_KEY_PATH:-}" && -f "$API_KEY_PATH" ]]; then
            rm -f "$API_KEY_PATH"
          fi
